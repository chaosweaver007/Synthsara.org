name: Bootstrap dependency security update

on:
  push:
    branches:
      - feature/public-audit-site
    paths:
      - '.github/workflows/dependency-security-fix.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/public-audit-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Upgrade patched production dependencies
        run: |
          npm install next@16.3.5 --save-exact
          npm audit fix

      - name: Verify production dependency threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Commit refreshed lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'Fix production dependency vulnerabilities'
          git push origin HEAD:feature/public-audit-site
