name: Refresh portal lockfile

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-portal-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/uds-public-documentation
          persist-credentials: true

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate the locked dependency graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Enforce the production dependency threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Commit the verified lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate the public portal lockfile"
          git push origin HEAD:agent/uds-public-documentation
