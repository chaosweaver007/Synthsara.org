name: Refresh portal lockfile

on:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .github/workflows/refresh-portal-lockfile.yml

permissions:
  contents: read

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate the locked dependency graph
        run: npm install --package-lock-only --ignore-scripts

      - name: Enforce the production dependency threshold
        run: npm audit --omit=dev --audit-level=high

      - name: Upload regenerated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synthsara-public-portal-lockfile
          path: package-lock.json
          retention-days: 7
          if-no-files-found: error
