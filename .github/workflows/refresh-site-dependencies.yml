name: One-time dependency refresh for Synthsara website
on:
  push:
    branches:
      - feat/sovereign-website-2026-11-06
    paths:
      - '.github/workflows/refresh-site-dependencies.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.repository == 'chaosweaver007/Synthsara.org'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sovereign-website-2026-11-06
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Upgrade vulnerable production dependencies and refresh lock
        run: |
          npm install --package-lock-only --save-exact next@16.4.5
          npm audit fix --package-lock-only
          npm audit --omit=dev --audit-level=high
      - name: Commit verified dependency lock updates to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(deps): update Next.js and vulnerable transitive packages'
            git push origin HEAD:feat/sovereign-website-2026-11-06
          fi
