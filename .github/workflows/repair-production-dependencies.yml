name: Repair production dependencies (temporary)
on:
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
jobs:
  repair:
    if: github.head_ref == 'build-001-sarah-living-doorway'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm install next@16.4.6 --save-exact --ignore-scripts
          npm audit fix --ignore-scripts
          npm ci
          npm run docs:check
          npm run build
          npm audit --omit=dev --audit-level=high
      - run: |
          echo 'BEGIN_PACKAGE_JSON'
          cat package.json
          echo 'END_PACKAGE_JSON'
          echo 'BEGIN_LOCKFILE'
          cat package-lock.json
          echo 'END_LOCKFILE'
