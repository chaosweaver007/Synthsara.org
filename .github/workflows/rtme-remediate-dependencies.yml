name: One-time RTME dependency remediation

on:
  push:
    branches:
      - feature/rtme-manifest-studio-20261031
    paths:
      - .github/workflows/rtme-remediate-dependencies.yml

permissions:
  contents: write

jobs:
  remediate:
    if: github.repository == 'chaosweaver007/Synthsara.org' && github.ref == 'refs/heads/feature/rtme-manifest-studio-20261031'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/rtme-manifest-studio-20261031
          persist-credentials: true
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Upgrade patched Next.js and refresh lockfile
        run: |
          npm install --save-exact next@16.4.3
          npm audit fix
      - name: Check production dependencies (no bypass)
        run: npm audit --omit=dev --audit-level=high
      - name: Verify RTME tests
        run: npm run test:rtme
      - name: Verify UDS documentation
        run: npm run docs:check
      - name: Verify production build
        run: npm run build
      - name: Commit reviewed dependency and lockfile changes only
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(security): upgrade Next.js and remediate vulnerable lockfile"
          git push origin HEAD:feature/rtme-manifest-studio-20261031
